version: "3.8"

services:
  api:
    build: .
    container_name: fleet_api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      CALLPRO_API_KEY: "${CALLPRO_API_KEY}"
      CALLPRO_API_URL: "${CALLPRO_API_URL}"
      CALLPRO_SENDER: "${CALLPRO_SENDER}"
      CORS_WHITELIST: "${CORS_WHITELIST}"
      NODE_ENV: "production"
